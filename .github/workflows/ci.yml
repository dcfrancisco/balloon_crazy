name: Gate 1 verification

on:
  push:
    branches: [main, update-BALLOON.BAS]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - name: Verify Gate 1
        run: ./tool/verify.sh
      - name: Export formatter patch for Intel macOS recovery
        if: always()
        run: |
          dart format lib test
          git diff --binary > /tmp/balloon-crazy-format.patch
      - name: Upload formatter patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatter-patch
          path: /tmp/balloon-crazy-format.patch
