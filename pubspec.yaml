name: balloon_crazy
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.32.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/fonts/

  fonts:
    - family: DigitalReadout
      fonts:
        - asset: assets/fonts/digital-readout.light.ttf
        - asset: assets/fonts/digital-readout.medium.ttf
          weight: 600
        - asset: assets/fonts/digital-readout.heavy.ttf
          weight: 800
